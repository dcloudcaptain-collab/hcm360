{% extends 'base.html' %}
{% block page_title %}File New Administrative Case{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
  <h2 style="margin:0;font-size:1.25rem;font-weight:700;">File New Administrative Case</h2>
  <a href="/discipline/" style="font-size:.85rem;color:var(--primary,#4f46e5);">← Cases</a>
</div>
<form method="post" class="card" style="padding:1.25rem;display:flex;flex-direction:column;gap:1rem;max-width:640px;">
  <div>
    <label style="font-size:.78rem;font-weight:600;color:#6b7280;display:block;margin-bottom:.25rem;">Respondent *</label>
    <select name="respondent_id" required style="width:100%;border:1px solid #d1d5db;border-radius:6px;padding:8px 10px;font-size:.875rem;">
      <option value="">— Select Employee —</option>
      {% for e in employees %}<option value="{{ e.id }}">{{ e.name }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label style="font-size:.78rem;font-weight:600;color:#6b7280;display:block;margin-bottom:.25rem;">Complainant (leave blank for motu proprio)</label>
    <select name="complainant_id" style="width:100%;border:1px solid #d1d5db;border-radius:6px;padding:8px 10px;font-size:.875rem;">
      <option value="">— None (Motu Proprio) —</option>
      {% for e in employees %}<option value="{{ e.id }}">{{ e.name }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label style="font-size:.78rem;font-weight:600;color:#6b7280;display:block;margin-bottom:.25rem;">Offense Type *</label>
    <select name="case_type_id" required style="width:100%;border:1px solid #d1d5db;border-radius:6px;padding:8px 10px;font-size:.875rem;">
      <option value="">— Select —</option>
      {% for ct in case_types %}
      <option value="{{ ct.id }}">{{ ct.gravity }} — {{ ct.name }} {% if ct.legal_basis %}({{ ct.legal_basis }}){% endif %}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label style="font-size:.78rem;font-weight:600;color:#6b7280;display:block;margin-bottom:.25rem;">Date of Offense</label>
    <input name="date_of_offense" type="date" style="border:1px solid #d1d5db;border-radius:6px;padding:8px 10px;font-size:.875rem;">
  </div>
  <div>
    <label style="font-size:.78rem;font-weight:600;color:#6b7280;display:block;margin-bottom:.25rem;">Description of Offense *</label>
    <textarea name="offense_description" required rows="4" placeholder="Describe the offense in detail..."
              style="width:100%;border:1px solid #d1d5db;border-radius:6px;padding:8px 10px;font-size:.875rem;resize:vertical;"></textarea>
  </div>
  <button type="submit" style="padding:10px 20px;background:var(--primary,#4f46e5);color:#fff;border:none;border-radius:7px;font-size:.95rem;font-weight:700;cursor:pointer;align-self:flex-start;">
    File Case
  </button>
</form>
{% endblock %}
