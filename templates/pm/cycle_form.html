{% extends "base.html" %}
{% block page_title %}{{ 'Edit Cycle' if cycle else 'New Performance Cycle' }}{% endblock %}
{% block content %}
<style>
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;}
.form-section{margin-bottom:1.5rem;}
.form-section h3{font-size:.9rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin:0 0 .75rem;padding-bottom:.5rem;border-bottom:1px solid #e2e8f0;}
.field{display:flex;flex-direction:column;gap:.25rem;}
.field label{font-size:.78rem;font-weight:600;color:#475569;}
.field input,.field select{border:1px solid #d1d5db;border-radius:6px;padding:7px 12px;font-size:.875rem;width:100%;box-sizing:border-box;}
.form-actions{display:flex;gap:.75rem;margin-top:1.5rem;padding-top:1rem;border-top:1px solid #e2e8f0;}
.btn{padding:8px 20px;border:none;border-radius:6px;font-size:.875rem;font-weight:600;cursor:pointer;text-decoration:none;}
.btn-primary{background:var(--primary,#4f46e5);color:#fff;}
.btn-secondary{background:#f1f5f9;color:#374151;border:1px solid #d1d5db;}
.required::after{content:" *";color:#ef4444;}
</style>
<h2 style="font-size:1.3rem;font-weight:700;margin:0 0 1.5rem;">{{ 'Edit Cycle' if cycle else 'New Performance Cycle' }}</h2>
<form method="post" class="card" style="padding:1.5rem;">
  <div class="form-section">
    <h3>Cycle Details</h3>
    <div class="form-grid">
      <div class="field"><label class="required">Cycle Name</label><input name="name" value="{{ cycle.name if cycle else '' }}" required placeholder="e.g. 2026 Year-End Review"></div>
      <div class="field"><label class="required">Type</label>
        <select name="cycle_type" required>
          {% for t in ['ANNUAL','SEMI_ANNUAL'] %}
          <option value="{{ t }}" {% if cycle and cycle.cycle_type == t %}selected{% endif %}>{{ t|replace('_',' ')|title }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field"><label class="required">Period From</label><input type="date" name="period_from" value="{{ cycle.period_from if cycle else '' }}" required></div>
      <div class="field"><label class="required">Period To</label><input type="date" name="period_to" value="{{ cycle.period_to if cycle else '' }}" required></div>
      <div class="field"><label>Status</label>
        <select name="status">
          {% for s in ['PLANNING','ACTIVE','COMPLETED','CLOSED'] %}
          <option value="{{ s }}" {% if cycle and cycle.status == s %}selected{% endif %}>{{ s|title }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">{{ 'Update' if cycle else 'Create' }} Cycle</button>
    <a href="{{ url_for('pm.cycles') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
