{% extends "base.html" %}
{% block page_title %}{{ 'Edit Program' if program else 'New Training Program' }}{% endblock %}
{% block content %}
<style>
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;}
.form-section{margin-bottom:1.5rem;}
.form-section h3{font-size:.9rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin:0 0 .75rem;padding-bottom:.5rem;border-bottom:1px solid #e2e8f0;}
.field{display:flex;flex-direction:column;gap:.25rem;}
.field label{font-size:.78rem;font-weight:600;color:#475569;}
.field input,.field select,.field textarea{border:1px solid #d1d5db;border-radius:6px;padding:7px 12px;font-size:.875rem;width:100%;box-sizing:border-box;}
.form-actions{display:flex;gap:.75rem;margin-top:1.5rem;padding-top:1rem;border-top:1px solid #e2e8f0;}
.btn{padding:8px 20px;border:none;border-radius:6px;font-size:.875rem;font-weight:600;cursor:pointer;text-decoration:none;}
.btn-primary{background:var(--primary,#4f46e5);color:#fff;}
.btn-secondary{background:#f1f5f9;color:#374151;border:1px solid #d1d5db;}
.required::after{content:" *";color:#ef4444;}
</style>
<h2 style="font-size:1.3rem;font-weight:700;margin:0 0 1.5rem;">{{ 'Edit Program' if program else 'New Training Program' }}</h2>
<form method="post" class="card" style="padding:1.5rem;">
  <div class="form-section">
    <h3>Program Details</h3>
    <div class="form-grid">
      <div class="field"><label class="required">Code</label><input name="code" value="{{ program.code if program else '' }}" required placeholder="e.g. ARTA-101"></div>
      <div class="field"><label class="required">Title</label><input name="title" value="{{ program.title if program else '' }}" required></div>
      <div class="field"><label>Category</label>
        <select name="category">
          {% for c in ['TRAINING','SEMINAR','WORKSHOP','CONFERENCE','CERTIFICATION'] %}
          <option value="{{ c }}" {% if program and program.category == c %}selected{% endif %}>{{ c|title }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field"><label>Delivery Mode</label>
        <select name="delivery_mode">
          {% for m in ['CLASSROOM','ONLINE','BLENDED'] %}
          <option value="{{ m }}" {% if program and program.delivery_mode == m %}selected{% endif %}>{{ m|title }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field"><label>Provider</label><input name="provider" value="{{ program.provider if program else '' }}"></div>
      <div class="field"><label>Duration (hours)</label><input type="number" name="duration_hours" value="{{ program.duration_hours if program else '' }}"></div>
      <div class="field" style="grid-column:1/-1;"><label>Description</label><textarea name="description" rows="3">{{ program.description if program else '' }}</textarea></div>
      <div class="field"><label><input type="checkbox" name="is_mandatory" {% if program and program.is_mandatory %}checked{% endif %}> Mandatory</label></div>
    </div>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">{{ 'Update' if program else 'Create' }} Program</button>
    <a href="{{ url_for('ld.programs') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
