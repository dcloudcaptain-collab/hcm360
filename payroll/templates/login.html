<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Attendance & Payroll</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="login-shell">
  <div class="login-card card">
    <h2 style="margin:0 0 .5rem;font-size:1.5rem;font-weight:700;">Attendance & Payroll</h2>
    <p style="color:#6b7280;font-size:.9rem;margin-bottom:1.5rem;">Select a user to continue</p>
    <form method="post" class="login-form">
      <select name="user_id" required>
        <option value="">Select User...</option>
        {% for u in users %}
        <option value="{{ u.id }}">{{ u.display_name }} ({{ u.role_code }})</option>
        {% endfor %}
      </select>
      <button type="submit">Login</button>
    </form>
  </div>
</div>
</body>
</html>
